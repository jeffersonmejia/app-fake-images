services:
  image-verifier:
    build:
      context: ./services/image-verifier
    container_name: noticias-image-verifier
    restart: unless-stopped
    environment:
      IMAGE_VERIFIER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${IMAGE_VERIFIER_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    mem_limit: 2g
    cpus: 1.5

  image-files:
    image: nginx:alpine
    container_name: noticias-image-files
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMAGE_FILES_PORT:-8091}:80"
    volumes:
      - ./var/private-images:/usr/share/nginx/html/uploads:ro
      - ./services/image-files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    cpus: 0.25

  db:
    image: postgres:17-alpine
    container_name: noticias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - noticias_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0

volumes:
  noticias_postgres_data:
