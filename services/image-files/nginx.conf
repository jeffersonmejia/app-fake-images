server {
    listen 80;
    server_name _;
    autoindex off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/uploads/([0-9a-fA-F-]+\.(jpg|png|webp))$ {
        alias /usr/share/nginx/html/uploads/$1;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    location /uploads/ {
        return 404;
    }

    location / {
        return 404;
    }
}
